# ============================================================================
# Servidor Perimetral - Spring Cloud Gateway
# Compatible con Spring Boot 4.0.x y Spring Cloud 2025.1.x (Oakwood)
# ============================================================================

# Puerto del servidor (0 = puerto aleatorio)
server.port=8080

# Nombre de la aplicaci�n para Eureka
spring.application.name=servidor-perimetral

# ============================================================================
# Configuraci�n de Eureka
# ============================================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ============================================================================
# Configuraci�n del Config Server (si se utiliza)
# ============================================================================
spring.config.import=optional:configserver:http://localhost:8888

# ============================================================================
# Actuator y Endpoints de Gesti�n
# ============================================================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# ============================================================================
# Observabilidad y Tracing (Micrometer + Zipkin)
# ============================================================================
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Observabilidad con Prometheus
management.endpoints.web.exposure.include=*
management.metrics.export.prometheus.enabled=true

# ============================================================================
# Logging
# ============================================================================
# Nivel de logging
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.cloud=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.edu.pucmm=DEBUG

# Patr�n de logging
logging.pattern.console=%d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%t] %-5level %logger{36} - %msg%n

# ============================================================================
# Spring Cloud Gateway - Rutas adicionales (si se configuran via properties)
# ============================================================================
# Nota: Las rutas principales se definen program�ticamente en la clase
# ServidorPerimetralGatewayApplication.java

# ============================================================================
# Timeout y Resilencia
# ============================================================================
# Nota: En Spring Cloud Gateway MVC (no reactivo), los timeouts se configuran
# a través del RestClient/RestTemplate subyacente, no con httpclient.* que
# es exclusivo del Gateway reactivo (WebFlux).
spring.cloud.gateway.mvc.http-client.connect-timeout=10000
spring.cloud.gateway.mvc.http-client.read-timeout=30000
