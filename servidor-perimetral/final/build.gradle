plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'edu.pucmm'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

ext {
    set('springCloudVersion', "2025.1.0")
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    
    // Librería para la centralizacion de la configuración
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    
    // Librería de Eureka Cliente para service discovery
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    
    // Spring Cloud Gateway Server MVC - Compatible con Spring Boot 4.x y Spring Cloud 2025.1.x (Oakwood)
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webmvc'
    
    // Lombok para anotaciones como @Slf4j
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    
    // Librería log ELK
    implementation 'net.logstash.logback:logstash-logback-encoder:6.4'
    
    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // Observabilidad, con Micrometer y Opentracing
    implementation "io.micrometer:micrometer-observation"
    implementation "io.micrometer:micrometer-tracing-bridge-brave"
    implementation "io.micrometer:micrometer-registry-prometheus"

    // Para integración con Zipkin
    implementation "io.zipkin.reporter2:zipkin-reporter-brave"
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
